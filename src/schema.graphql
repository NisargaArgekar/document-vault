# GraphQL Schema for Document Vault

type Collection {
  id: ID!
  name: String!
  slug: String!
  createdAt: String!
  documents: [Document!]!
}

type Document {
  id: ID!
  title: String!
  content: String!
  tags: [String!]!
  collectionId: ID!
  collection: Collection!
  isArchived: Boolean!
  createdAt: String!
}

# Used to return paginated lists of documents
type PaginatedDocuments {
  edges: [DocumentEdge!]!
  pageInfo: PageInfo!
}

type DocumentEdge {
  node: Document!
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  collections: [Collection!]!
  collection(id: ID!): Collection
  documents(
    collectionId: ID
    search: String
    isArchived: Boolean
    take: Int
    cursor: String
  ): PaginatedDocuments!
}

type Mutation {
  createCollection(name: String!, slug: String!): Collection!
  
  createDocument(
    title: String!
    content: String!
    tags: [String!]
    collectionId: ID!
  ): Document!
  
  updateDocument(
    id: ID!
    title: String
    content: String
    tags: [String!]
    isArchived: Boolean
  ): Document!
  
  deleteDocument(id: ID!): Boolean!
  
  moveDocument(id: ID!, collectionId: ID!): Document!
}
